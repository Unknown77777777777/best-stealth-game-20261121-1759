<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quiet Gallery — a stealth game</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header id="hud">
    <div class="hud-left">
      <span id="hud-level">The Marble Hall — 1/3</span>
      <span id="hud-objective">Steal the artifacts, then reach the exit</span>
    </div>
    <div class="hud-right">
      <span id="hud-artifacts" title="Artifacts pocketed">◆ 0/2</span>
      <span id="hud-coins" title="Coins left to throw">◉ 3</span>
      <span id="hud-timer" title="Time on this level">0:00</span>
    </div>
  </header>
  <div id="meter">
    <div id="hud-detection" class="fill" style="width: 0%"></div>
    <span id="hud-detection-label">Detection 0%</span>
  </div>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="overlay" class="hidden"></div>
  </div>
  <footer id="help">
    <span><b>WASD / arrows</b> move</span>
    <span><b>Shift</b> sneak</span>
    <span><b>E</b> pick up / exit</span>
    <span><b>Q / click</b> toss a coin</span>
    <span><b>M</b> mute</span>
    <span><b>R</b> restart</span>
  </footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
